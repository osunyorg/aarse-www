theme: 
  - osuny
  - osuny-plugin-centered-layout
_merge: deep
params:
  search:
    active: true
    positions:
      - primary
  logo:
    header: '/assets/images/logoapp.svg'
    footer: '/assets/images/icone.svg'
  breadcrumb:
    extendable: false
    position: none
  home:
    head:
      title: site
  persons:
